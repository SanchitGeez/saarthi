services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: saarthi
      POSTGRES_PASSWORD: saarthi
      POSTGRES_DB: saarthi
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saarthi_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarthi"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  saarthi_db:
