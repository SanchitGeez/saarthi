[project]
name = "saarthi-api"
version = "0.1.0"
description = "Private, Gita-inspired conversation companion API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.40,<1",
  "google-adk>=1.22,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.31,<1",
  "pgvector>=0.4,<1",
  "pydantic-settings>=2.12,<3",
  "python-dotenv>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "PyJWT[crypto]>=2.10,<3",
  "openai>=2.8,<3",
  "httpx>=0.28,<1",
  "email-validator>=2.2,<3",
  "livekit-agents[elevenlabs,google,murf,deepgram,openai,silero,turn-detector]==1.8.4",
  "livekit-api==1.2.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
