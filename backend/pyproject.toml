[project]
name = "saarthi-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.128,<1",
  "google-adk>=1.25,<2",
  "litellm>=1.80,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.40,<1",
]

[project.optional-dependencies]
voice = [
    "pipecat-ai[cartesia,deepgram,webrtc]==0.0.108",
    "pipecat-murf-tts==0.2.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]
evals = [
    "deepeval==4.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: real OpenRouter smoke test (requires OPENROUTER_API_KEY and RUN_LIVE_AGENT_TEST=1)"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
