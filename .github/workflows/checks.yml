name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: saarthi
          POSTGRES_PASSWORD: saarthi
          POSTGRES_DB: saarthi
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U saarthi'
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://saarthi:saarthi@localhost:5432/saarthi
      TEST_DATABASE_URL: postgresql+psycopg://saarthi:saarthi@localhost:5432/saarthi
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.10.2'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest -q
      - run: node --check ../client/app.js
